name: Swift Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Swift 6.0
        uses: swift-ci/actions/setup-swift@v1
        with:
          version: '6.0.0'

      - name: Run Tests
        run: swift test
